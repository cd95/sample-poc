openapi: 3.0.3
info:
  title: Data Source POC API
  description: Dummy GET endpoints that each return a list of flat records, like rows from a db table.
  version: 1.0.0
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /api/github:
    get:
      summary: Get GitHub repository records
      operationId: getGithubData
      responses:
        '200':
          description: List of dummy GitHub repository rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Github'
  /api/okta:
    get:
      summary: Get Okta user records
      operationId: getOktaData
      responses:
        '200':
          description: List of dummy Okta user rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Okta'
  /api/aws:
    get:
      summary: Get AWS EC2 instance records
      operationId: getAwsData
      responses:
        '200':
          description: List of dummy AWS EC2 instance rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Aws'
components:
  schemas:
    Github:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        full_name: { type: string }
        private: { type: boolean }
        language: { type: string }
        stargazers_count: { type: integer }
        open_issues_count: { type: integer }
    Okta:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DEPROVISIONED] }
        login: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        last_login: { type: string, format: date-time }
    Aws:
      type: object
      properties:
        instance_id: { type: string }
        region: { type: string }
        instance_type: { type: string }
        state: { type: string }
        name: { type: string }
        env: { type: string }
